[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazylake"
version = "0.1.0"
description = "The terminal UI (TUI) for your data, AI and ML pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Adam Kharfi", email = "adam@khar.fi" }]
keywords = ["cloud", "ai", "data-engineering", "mlops", "tui", "textual"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "textual>=0.80",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "moto[glue,logs]>=5",
  "ruff>=0.6",
  "textual-dev>=1.5",
]

[project.scripts]
lazylake = "lazylake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lazylake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format; demo logs stay verbatim
